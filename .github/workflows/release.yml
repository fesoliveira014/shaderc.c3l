name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  C3C_VERSION: '0.8.5_1'
  SHADERC_REF: 0968768c61d4eb7dd861114412e904bb3d59b7b6 # v2025.1

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: shaderc.c3l
    steps:
      - uses: actions/checkout@v4
        with:
          path: shaderc.c3l
      - uses: actions/checkout@v4
        with:
          repository: google/shaderc
          ref: ${{ env.SHADERC_REF }}
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Fetch upstream dependencies
        working-directory: upstream
        run: python utils/git-sync-deps
      - name: Build the static library (Windows, /MT, no LTCG, no debug info)
        if: runner.os == 'Windows'
        env:
          MSYS_NO_PATHCONV: '1' # Git Bash would rewrite the /D and /EH flags into paths
        run: |
          cmake -S ../upstream -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /GR /EHsc /D_ITERATOR_DEBUG_LEVEL=0" \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DSHADERC_ENABLE_WERROR_COMPILE=OFF \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON \
            -DENABLE_GLSLANG_BINARIES=OFF -DSHADERC_ENABLE_SHARED_CRT=OFF
          cmake --build build/native --target shaderc_combined --parallel 4
      - name: Build the static library (Linux, PIC, libstdc++)
        if: runner.os == 'Linux'
        run: |
          cmake -S ../upstream -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DSHADERC_ENABLE_WERROR_COMPILE=OFF \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON \
            -DENABLE_GLSLANG_BINARIES=OFF -DSHADERC_ENABLE_SHARED_CRT=OFF
          cmake --build build/native --target shaderc_combined --parallel 4
      - name: Stage the archive
        env:
          SHADERC_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "stage/linked-libs/$SHADERC_TARGET"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp build/native/libshaderc/shaderc_combined.lib "stage/linked-libs/$SHADERC_TARGET/"
          else
            cp build/native/libshaderc/libshaderc_combined.a "stage/linked-libs/$SHADERC_TARGET/"
            strip --strip-debug "stage/linked-libs/$SHADERC_TARGET/libshaderc_combined.a"
          fi
          ls -l "stage/linked-libs/$SHADERC_TARGET"
      - name: Check the vendor pins against the manifest
        run: |
          python - <<'PY'
          import json, subprocess
          manifest = json.load(open("manifest.json"))["vendor"]
          for name in ("glslang", "spirv-tools", "spirv-headers"):
              commit = subprocess.check_output(["git", "-C", f"../upstream/third_party/{name}", "rev-parse", "HEAD"], text=True).strip()
              assert manifest[f"{name}-commit"] == commit, (name, manifest[f"{name}-commit"], commit)
          shaderc = subprocess.check_output(["git", "-C", "../upstream", "rev-parse", "HEAD"], text=True).strip()
          assert manifest["shaderc-commit"] == shaderc, (manifest["shaderc-commit"], shaderc)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: shaderc.c3l/stage
          if-no-files-found: error
          retention-days: 30

  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG=v0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
      - name: Pack per-platform artifacts
        run: |
          mkdir -p dist
          for platform in linux-x64 windows-x64; do
            root="stage-$platform"
            mkdir -p "$root"
            cp -r "natives/native-$platform/." "$root/"
            cp manifest.json shaderc.c3i README.md LICENSE LICENSE.shaderc.apache-2.0 NOTICE "$root/"
            cp -r licenses "$root/licenses"
            if find "$root" \( -name '*.dll' -o -name '*.so' -o -name '*.so.*' -o -name '*.dll.lib' \) | grep .; then
              echo "a shared object leaked into the $platform artifact" >&2
              exit 1
            fi
            (cd "$root" && find . -type f | sed 's|^\./||' | LC_ALL=C sort \
              | zip -X -q "../dist/shaderc-${TAG}-${platform}.c3l" -@)
          done
          (cd dist && sha256sum ./*.c3l | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS && ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  proof:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install C3 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.tar.gz" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux-static.tar.gz"
          tar -xzf "$RUNNER_TEMP/c3.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Install C3 (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.zip" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
          unzip -q "$RUNNER_TEMP/c3.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Check the archive contents
        run: |
          unzip -l dist/*-${{ matrix.target }}.c3l
          if unzip -Z1 dist/*-${{ matrix.target }}.c3l | grep -E '\.(dll|so)($|\.)'; then
            echo "shared objects in the archive" >&2
            exit 1
          fi
          unzip -Z1 dist/*-${{ matrix.target }}.c3l | grep -E '^linked-libs/${{ matrix.target }}/(lib)?shaderc_combined\.(a|lib)$'
      - name: Link and run against the packed archive
        run: |
          mkdir -p build/consumer
          cp dist/*-${{ matrix.target }}.c3l build/consumer/
          cd build
          c3c compile ../tests/static_proof.c3 --libdir consumer --lib shaderc --warn-deprecation=error -o static_proof 2>&1 | tee link.log
          if grep -i -E 'warning|LNK4' link.log; then
            echo "the build printed warnings" >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            dumpbin //nologo //dependents static_proof.exe | tee dependents.log
            if grep -i -E 'VCRUNTIME|MSVCP|ucrtbase|api-ms-win-crt|shaderc' dependents.log; then
              echo "dynamic CRT or shaderc dependency" >&2
              exit 1
            fi
            ./static_proof.exe
          else
            ldd ./static_proof | tee dependents.log
            if grep -i shaderc dependents.log; then
              echo "libshaderc is linked dynamically" >&2
              exit 1
            fi
            ./static_proof
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: proof
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.c3l ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

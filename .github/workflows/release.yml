name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  C3C_VERSION: '0.8.3'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: shaderc.c3l
    env:
      SHADERC_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: shaderc.c3l
      - uses: actions/checkout@v4
        with:
          repository: google/shaderc
          ref: 0968768c61d4eb7dd861114412e904bb3d59b7b6 # v2025.1
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Fetch upstream dependencies
        working-directory: upstream
        run: python utils/git-sync-deps
      - name: Build shared library
        run: |
          cmake_args=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmake_args=(-G "Visual Studio 17 2022" -A x64)
          fi
          cmake -S ../upstream -B build/native "${cmake_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON -DSHADERC_ENABLE_WERROR_COMPILE=OFF \
            -DSPIRV_SKIP_TESTS=ON -DSPIRV_SKIP_EXECUTABLES=ON \
            -DSHADERC_ENABLE_SHARED_CRT=OFF
          cmake --build build/native --config Release --target shaderc_shared --parallel 2
      - name: Stage natives
        run: |
          mkdir -p stage/licenses
          cp ../upstream/third_party/glslang/LICENSE.txt stage/licenses/glslang.txt
          cp ../upstream/third_party/spirv-tools/LICENSE stage/licenses/spirv-tools.txt
          cp ../upstream/third_party/spirv-headers/LICENSE stage/licenses/spirv-headers.txt
          cp ../upstream/DEPS stage/licenses/shaderc-DEPS
          git -C ../upstream rev-parse HEAD > stage/licenses/shaderc-revision.txt
          if [[ "$RUNNER_OS" == Windows ]]; then
            mkdir stage/windows
            cp build/native/libshaderc/Release/shaderc_shared.{dll,lib} stage/windows/
          else
            mkdir stage/linux
            cp build/native/libshaderc/libshaderc_shared.so.1 stage/linux/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: shaderc.c3l/stage
          if-no-files-found: error
          retention-days: 30

  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
      - name: Pack per-platform artifacts
        run: |
          mkdir -p dist
          for platform in linux-x64 windows-x64; do
            root="stage-$platform"
            mkdir -p "$root"
            cp -r "natives/native-$platform/." "$root/"
            cp manifest.json shaderc.c3i README.md LICENSE LICENSE.shaderc.apache-2.0 NOTICE "$root/"
            (cd "$root" && find . -type f | sed 's|^\./||' | LC_ALL=C sort \
              | zip -X -q "../dist/shaderc-v${VERSION}-${platform}.c3l" -@)
          done
          (cd dist && sha256sum ./*.c3l | sed 's|\./||' > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Install C3 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.tar.gz" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux-static.tar.gz"
          tar -xzf "$RUNNER_TEMP/c3.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Install C3 (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.zip" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
          unzip -q "$RUNNER_TEMP/c3.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Compile unpacked sources
        run: |
          mkdir unpacked
          unzip -q dist/*-${{ matrix.target }}.c3l -d unpacked
          unzip -l dist/*-${{ matrix.target }}.c3l
          test -f unpacked/manifest.json
          c3c compile-only --no-obj unpacked/shaderc.c3i
      - name: Build and run against the packed library
        run: |
          mkdir -p build/consumer
          cp dist/*-${{ matrix.target }}.c3l build/consumer/
          cd build
          c3c compile ../tests/smoke.c3 --libdir consumer --lib shaderc --warn-deprecation=error -o smoke
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "$(find . -path '*unpacked_c3l*' -name shaderc_shared.dll | head -n 1)" .
            ./smoke.exe
          else
            cp "$(find . -path '*unpacked_c3l*' -name libshaderc_shared.so.1 | head -n 1)" .
            ./smoke
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.c3l ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes

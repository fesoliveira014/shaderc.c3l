name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  C3C_VERSION: '0.8.3'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: shaderc.c3l
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Test release tooling
        working-directory: shaderc.c3l
        run: python -B -m unittest discover -s tests -v
      - name: Build pinned shaderc
        working-directory: shaderc.c3l
        run: python scripts/build_native.py --jobs 2
      - name: Install C3 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.tar.gz" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux-static.tar.gz"
          tar -xzf "$RUNNER_TEMP/c3.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Install C3 (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/c3.zip" \
            "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-windows.zip"
          unzip -q "$RUNNER_TEMP/c3.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"
      - name: Compile and run consumer
        working-directory: shaderc.c3l
        run: python scripts/smoke.py
      - name: Package platform bundle
        working-directory: shaderc.c3l
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/package_release.py --target "$TARGET" --version ci
      - name: Test extracted bundle
        working-directory: shaderc.c3l
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -m zipfile -e "dist/shaderc.c3l-ci-${TARGET}.zip" "$RUNNER_TEMP/consumer"
          python scripts/smoke.py --library "$RUNNER_TEMP/consumer/shaderc.c3l"
      - uses: actions/upload-artifact@v4
        with:
          name: shaderc-${{ matrix.target }}
          path: shaderc.c3l/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: shaderc-*
          path: artifacts
      - name: Verify and assemble release
        run: |
          python scripts/fetch_native_libs.py "$GITHUB_REF_NAME" --target linux-x64 \
            --base-url "file://$PWD/artifacts/shaderc-linux-x64"
          python scripts/fetch_native_libs.py "$GITHUB_REF_NAME" --target windows-x64 \
            --base-url "file://$PWD/artifacts/shaderc-windows-x64"
          python scripts/package_release.py --version "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
